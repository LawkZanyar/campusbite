# SHARED FILE (owner: Lawk) - settings for the whole app
spring.application.name=campusbite
server.port=8080

# Phase 1: every module keeps its data in an in-memory repository
# (classes marked @Profile("memory")). MySQL arrives in Week 08.
spring.profiles.active=memory

# Re-read templates on every request while we develop
spring.thymeleaf.cache=false

# Keep the session id only in a cookie, never in the URL (";jsessionid=..." in a URL
# can leak through links and browser history)
server.servlet.session.tracking-modes=cookie
