<!DOCTYPE html>
<!-- M1 Authentication & Accounts (owner: Lawk) - login page -->
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Log in &middot; CampusBite</title>
    <th:block th:replace="~{layout/main :: head}"></th:block>
</head>
<body>
<header th:replace="~{layout/main :: nav}"></header>

<main class="container">
    <div class="panel form">
        <h1>Log in</h1>

        <!-- ${param.registered} is true when the URL is /login?registered -->
        <div class="alert alert-success" th:if="${param.registered}">Account created, please log in.</div>
        <div class="alert alert-error" th:if="${errorMessage}" th:text="${errorMessage}">Error</div>

        <form th:action="@{/login}" th:object="${form}" method="post" novalidate>
            <div class="form-row">
                <label for="email">Email</label>
                <input type="email" id="email" th:field="*{email}" th:errorclass="field-error" autofocus>
                <div class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Email error</div>
            </div>
            <div class="form-row">
                <label for="password">Password</label>
                <input type="password" id="password" th:field="*{password}" th:errorclass="field-error">
                <div class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">Password error</div>
            </div>
            <button type="submit" class="btn btn-primary">Log in</button>
            <a class="btn-link" th:href="@{/register}">No account yet? Register</a>
        </form>

        <p class="muted small">Demo accounts (password Pass123!): student@campusbite.test,
            kitchen@campusbite.test, admin@campusbite.test</p>
    </div>
</main>

<footer th:replace="~{layout/main :: footer}"></footer>
</body>
</html>
