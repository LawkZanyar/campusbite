<!DOCTYPE html>
<!-- M5 Cart & Checkout (owner: Hananeh) - the cart page -->
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>My cart &middot; CampusBite</title>
    <th:block th:replace="~{layout/main :: head}"></th:block>
</head>
<body>
<header th:replace="~{layout/main :: nav}"></header>

<main class="container">
    <div class="page-header">
        <h1>My cart</h1>
    </div>

    <div class="alert alert-error" th:if="${errorMessage}" th:text="${errorMessage}">Error</div>

    <div class="empty" th:if="${cart.empty}">
        Your cart is empty. <a th:href="@{/menu}">Browse the menu</a>
    </div>

    <th:block th:unless="${cart.empty}">
        <div class="table-wrap">
            <table>
                <thead>
                <tr><th>Item</th><th class="right">Price</th><th>Quantity</th><th class="right">Total</th><th></th></tr>
                </thead>
                <tbody>
                <tr th:each="line : ${cart.lines}">
                    <td th:text="${line.name}">Chicken biryani</td>
                    <td class="right" th:text="${line.unitPriceLabel}">5,000 IQD</td>
                    <td>
                        <!-- each row has its own small POST form to change the quantity -->
                        <form th:action="@{/cart/update}" method="post" class="inline-form">
                            <input type="hidden" name="itemId" th:value="${line.menuItemId}">
                            <input type="number" name="quantity" min="0" max="10" class="narrow"
                                   th:value="${line.quantity}">
                            <button type="submit" class="btn btn-small">Update</button>
                        </form>
                    </td>
                    <td class="right" th:text="${line.lineTotalLabel}">5,000 IQD</td>
                    <td>
                        <form th:action="@{/cart/remove}" method="post" class="inline-form">
                            <input type="hidden" name="itemId" th:value="${line.menuItemId}">
                            <button type="submit" class="btn btn-small btn-danger">Remove</button>
                        </form>
                    </td>
                </tr>
                </tbody>
                <tfoot>
                <tr>
                    <th colspan="3" class="right" th:text="${cart.itemCount} + ' item(s)'">3 item(s)</th>
                    <th class="right" th:text="${cart.totalLabel}">7,500 IQD</th>
                    <th></th>
                </tr>
                </tfoot>
            </table>
        </div>
        <p class="muted small">At most 10 of one item and 30 items per order.</p>
        <p>
            <a class="btn" th:href="@{/menu}">Add more</a>
            <a class="btn btn-primary" th:href="@{/checkout}">Proceed to checkout</a>
        </p>
    </th:block>
</main>

<footer th:replace="~{layout/main :: footer}"></footer>
</body>
</html>
