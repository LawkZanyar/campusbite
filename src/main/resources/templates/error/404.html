<!DOCTYPE html>
<!-- SHARED FILE (owner: Lawk) - shown for unknown URLs and for NotFoundException -->
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Not found &middot; CampusBite</title>
    <th:block th:replace="~{layout/main :: head}"></th:block>
</head>
<body>
<header th:replace="~{layout/main :: nav}"></header>
<main class="container">
    <div class="error-page">
        <h1>404</h1>
        <h2>We couldn't find that</h2>
        <!-- "message" is set by GlobalExceptionHandler; for unknown URLs it is empty -->
        <p class="muted" th:text="${#strings.isEmpty(message)} ? 'The page you asked for does not exist.' : ${message}">
            The page you asked for does not exist.
        </p>
        <a class="btn btn-primary" th:href="@{/}">Back to the home page</a>
    </div>
</main>
<footer th:replace="~{layout/main :: footer}"></footer>
</body>
</html>
