# SHARED FILE (owner: Lawk)
# Only read while the "memory" profile is active (Phase 1).
# spring-boot-starter-jdbc is on the classpath but we have no database yet, so we tell
# Spring Boot NOT to create a DataSource. Without this line the app stops at start-up
# with "Failed to configure a DataSource".
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
